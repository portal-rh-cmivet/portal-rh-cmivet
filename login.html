<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login - Portal RH CMIVET</title>
<link rel="stylesheet" href="enterprise.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0E4D47">

<div class="card" style="width:420px;padding:40px">

<h1 style="text-align:center;margin-bottom:10px;color:#0E4D47">Portal RH CMIVET</h1>
<p style="text-align:center;margin-bottom:30px">Acesse sua conta</p>

<form id="loginForm">

<div class="question">
<label>E-mail</label>
<input id="email" type="email" placeholder="seu@email.com">
</div>

<div class="question">
<label>Senha</label>
<input id="senha" type="password" placeholder="********">
</div>

<div class="actions">
<button id="loginButton" class="primary-btn" type="submit" style="width:100%">Entrar</button>
</div>

<p id="loginMessage" style="margin-top:20px;text-align:center"></p>

</form>

</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>

</body>
</html>
